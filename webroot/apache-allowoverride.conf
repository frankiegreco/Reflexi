# Necessario perché il rewrite delle URL pulite di /news e della sitemap
# dinamica passa da webroot/.htaccess: l'immagine php:8.2-apache di base ha
# AllowOverride None su /var/www/, quindi .htaccess verrebbe ignorato senza
# questo override esplicito.
<Directory /var/www/html>
    AllowOverride All
</Directory>
